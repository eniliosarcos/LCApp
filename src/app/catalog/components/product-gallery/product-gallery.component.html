<div class="gallery">
  <div class="main-image" aria-hidden="true">
    <ng-container *ngIf="hasImages; else noImage">
      <img
        *ngIf="mainImage?.url && !mainImageFailed"
        [src]="mainImage?.url"
        [srcset]="mainSrcset"
        sizes="(min-width: 720px) 520px, 100vw"
        [alt]="mainImage?.alt || 'Imagen del producto'"
        fetchpriority="high"
        (error)="onMainImageError()">
      <span *ngIf="!mainImage?.url || mainImageFailed" class="main-fallback">{{ fallback }}</span>
    </ng-container>
    <ng-template #noImage>
      <span class="main-fallback">{{ fallback }}</span>
    </ng-template>
  </div>

  <div class="thumbnails" *ngIf="images.length > 1">
    <button
      type="button"
      class="thumbnail"
      *ngFor="let image of images"
      (click)="selectImage(image)"
      [class.selected]="image.id === selectedImage?.id">
      <img
        *ngIf="image.url && !thumbFailed(image)"
        [src]="image.url"
        [alt]="image.alt || 'Miniatura del producto'"
        loading="lazy"
        decoding="async"
        (error)="onThumbImageError(image)">
      <span *ngIf="!image.url || thumbFailed(image)" class="thumb-fallback">{{ fallback }}</span>
    </button>
  </div>
</div>
