<div class="admin-shell">
  <button
    type="button"
    class="sidebar-toggle"
    (click)="toggleSidebar()"
    [attr.aria-expanded]="sidebarOpen"
    aria-controls="admin-sidebar"
    aria-label="Abrir menú de administración">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <div
    class="sidebar-backdrop"
    *ngIf="sidebarOpen"
    (click)="closeSidebar()"></div>

  <aside class="sidebar" id="admin-sidebar" [class.open]="sidebarOpen">
    <div class="sidebar-brand">
      <span class="brand-mark">LC</span>
      <span class="brand-name">Admin</span>
    </div>

    <nav class="sidebar-nav" aria-label="Secciones de administración">
      <a
        routerLink="/admin"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebar()">Dashboard</a>
      <a
        routerLink="/admin/contact"
        routerLinkActive="active"
        (click)="closeSidebar()">Configuración de contacto</a>
    </nav>

    <button type="button" class="logout" (click)="logout()">Cerrar sesión</button>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
