<ng-container *ngIf="!isAdminRoute">
  <app-header></app-header>
</ng-container>
<main [class.main--no-pad]="isAdminRoute">
  <div *ngIf="!isAdminRoute; else adminOutlet" [@routeAnimations]="getRouteAnimationData()">
    <router-outlet></router-outlet>
  </div>
  <ng-template #adminOutlet>
    <router-outlet></router-outlet>
  </ng-template>
</main>
<app-snackbar></app-snackbar>
