<article class="cart-item">
  <div class="media" aria-hidden="true">
    <img
      *ngIf="productImage && !imageFailed"
      [src]="productImage"
      [alt]="item.product.images[0].alt || item.product.name"
      loading="lazy"
      decoding="async"
      (error)="onImageError()">
    <span *ngIf="!productImage || imageFailed" class="fallback">{{ fallback }}</span>
  </div>

  <div class="info">
    <h3>{{ item.product.name }}</h3>
    <div class="controls">
      <div class="quantity" role="group" [attr.aria-label]="'Cantidad de ' + item.product.name">
        <button type="button" aria-label="Disminuir cantidad" (click)="decreaseQuantity()">−</button>
        <span>{{ item.quantity }}</span>
        <button type="button" aria-label="Aumentar cantidad" [disabled]="!canIncrease" (click)="increaseQuantity()">+</button>
      </div>
      <p class="stock-hint" *ngIf="atStockLimit">Stock disponible: {{ item.product.stock }}</p>
      <button type="button" class="remove" (click)="onRemove()">Quitar</button>
    </div>
  </div>

  <div class="price">
    <ng-container *ngIf="hasDiscount; else noDiscount">
      <p class="discount-price">{{ unitPrice | currencyFormat }}</p>
      <p class="regular-price">{{ item.product.price | currencyFormat }}</p>
    </ng-container>
    <ng-template #noDiscount>
      <p class="price">{{ unitPrice | currencyFormat }}</p>
    </ng-template>
  </div>
</article>
