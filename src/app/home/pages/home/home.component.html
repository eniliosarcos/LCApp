<section class="home">
  <div class="hero">
    <div class="container">
      <h1 class="hero-title">L'Essence de Cerise</h1>
      <p class="hero-subtitle">Descubre nuestra colección exclusiva</p>
    </div>
  </div>

  <app-category-strip></app-category-strip>

  <div class="container home-content">
    <div class="search-bar" *ngIf="!loading && !error && products.length">
      <input type="text" placeholder="Buscar producto…" [(ngModel)]="searchTerm">
    </div>

    <app-breadcrumbs *ngIf="isCatalogView" [items]="breadcrumbItems"></app-breadcrumbs>

    <h2 class="section-title" appScrollReveal>{{ selectedCategoryName }}</h2>
    <p class="error" *ngIf="error">No se pudieron cargar los productos. Intenta de nuevo.</p>

    <div class="grid" *ngIf="!error && loading">
      <app-loading-spinner label="Cargando productos…"></app-loading-spinner>
    </div>

    <div class="grid" *ngIf="!error && !loading && filteredProducts.length; else empty">
      <app-product-card *ngFor="let product of filteredProducts; trackBy: productTrackBy" [product]="product"></app-product-card>
    </div>

    <ng-template #empty>
      <p class="empty" *ngIf="!error && !loading">
        {{ searchTerm
            ? 'No se encontraron productos para "' + searchTerm + '".'
            : 'No hay productos en esta categoría.' }}
      </p>
    </ng-template>
  </div>
</section>
