<article class="card">
  <a [routerLink]="productLink()" class="card-link">
    <div class="card-media" aria-hidden="true">{{ product.name.charAt(0) }}</div>
    <div class="card-body">
      <h2>{{ product.name }}</h2>
      <p>{{ product.description }}</p>
      <p class="stock" [class]="getStockStatus()">
        <ng-container [ngSwitch]="getStockStatus()">
          <ng-container *ngSwitchCase="'in-stock'">En stock</ng-container>
          <ng-container *ngSwitchCase="'low-stock'">¡Últimas {{ product.stock }} unidades!</ng-container>
          <ng-container *ngSwitchCase="'out-of-stock'">Agotado</ng-container>
        </ng-container>
      </p>
      <p class="price" *ngIf="product.discountPrice; else noDiscount">
        <span class="discount">{{ getDisplayPrice() | currencyFormat }}</span>
        <span class="regular">{{ product.price | currencyFormat }}</span>
      </p>
      <ng-template #noDiscount>
        <p class="price">{{ getDisplayPrice() | currencyFormat }}</p>
      </ng-template>
    </div>
  </a>
  <div class="card-actions">
    <button type="button" [disabled]="isOutOfStock()" (click)="addToCart()">
      {{ isOutOfStock() ? 'Agotado' : (added ? '✓ Agregado' : 'Agregar al carrito') }}
    </button>
  </div>
</article>
