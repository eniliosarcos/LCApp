name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Inject environments from secrets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('src/environments', { recursive: true });

            const devContent = `import { Environment } from '../app/core/models/environment.model';

            export const environment: Environment = {
              production: false,
              apiUrl: 'http://localhost:3000/api',
              contact: {
                whatsapp: '',
                whatsappDisplay: '',
                instagram: '',
                telegram: '',
              },
            };
            `;
            fs.writeFileSync('src/environments/environment.ts', devContent);

            const prodContent = `import { Environment } from '../app/core/models/environment.model';

            export const environment: Environment = {
              production: true,
              apiUrl: '${{ secrets.API_URL }}',
              contact: {
                whatsapp: '${{ secrets.WHATSAPP_NUMBER }}',
                whatsappDisplay: '${{ secrets.WHATSAPP_DISPLAY }}',
                instagram: '${{ secrets.INSTAGRAM_HANDLE }}',
                telegram: '${{ secrets.TELEGRAM_HANDLE }}',
              },
            };
            `;
            fs.writeFileSync('src/environments/environment.prod.ts', prodContent);

      - name: Build
        run: npx ng build --configuration production --base-href /LCApp/

      - name: Copy index.html to 404.html
        run: cp dist/catalog/index.html dist/catalog/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/catalog

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
